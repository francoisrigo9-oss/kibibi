<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kibibi - Short Videos</title>
    <!-- SDK Google IMA pour la monétisation internationale -->
    <script src="https://googleapis.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* Conteneur principal style TikTok (Vertical Snap) */
        .tiktok-container { width: 100%; height: 100vh; scroll-snap-type: y mandatory; overflow-y: scroll; scroll-behavior: smooth; }
        
        /* Chaque flux vidéo prend tout l'écran */
        .video-feed { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; }
        
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Nom de l'application et overlays */
        .brand-header { position: absolute; top: 20px; left: 0; width: 100%; text-align: center; z-index: 20; }
        .brand-header h1 { color: #fff; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: 800; letter-spacing: 1px; }
        .brand-header span { color: #00f2fe; }

        /* Interface utilisateur sur le côté (Like, Monétiser) */
        .side-bar { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; z-index: 20; align-items: center; }
        .action-btn { width: 55px; height: 55px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 22px; cursor: pointer; border: none; backdrop-filter: blur(5px); }
        .action-btn.monetize { background: #ff007f; animation: pulse 2s infinite; }
        
        /* Infos de la vidéo en bas */
        .video-meta { position: absolute; left: 15px; bottom: 30px; z-index: 20; color: white; max-width: 75%; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .video-meta h3 { font-size: 16px; margin-bottom: 5px; }
        .video-meta p { font-size: 14px; opacity: 0.9; }

        /* Conteneur de publicité Google IMA superposé */
        #ad-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
        #ad-container.active { pointer-events: auto; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 0, 127, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 127, 0); }
        }
    </style>
</head>
<body>

    <!-- Entête Fixe -->
    <div class="brand-header">
        <h1>KIBI<span>BI</span></h1>
    </div>

    <!-- Zone publicitaire invisible au départ -->
    <div id="ad-container"></div>

    <!-- Flux de vidéos de l'application -->
    <div class="tiktok-container" id="feed-container">
        
        <!-- Vidéo 1 -->
        <div class="video-feed">
            <video loop muted autoplay playsinline class="kibibi-video">
                <source src="https://googleapis.com" type="video/mp4">
            </video>
            <div class="side-bar">
                <button class="action-btn monetize" onclick="startDataAd()">💰</button>
                <div style="color:white; font-size:11px; font-weight:bold;">Bonus</div>
            </div>
            <div class="video-meta">
                <h3>@impact_academy</h3>
                <p>Bienvenue sur Kibibi ! Swipez vers le bas pour charger le flux mondial 🌍</p>
            </div>
        </div>

        <!-- Vidéo 2 (Simule le préchargement automatique consommateur de mégas) -->
        <div class="video-feed">
            <video loop muted playsinline class="kibibi-video">
                <source src="https://googleapis.com" type="video/mp4">
            </video>
            <div class="side-bar">
                <button class="action-btn monetize" onclick="startDataAd()">💰</button>
            </div>
            <div class="video-meta">
                <h3>@africantech</h3>
                <p>Le contenu HD se charge en tâche de fond pour une fluidité maximale 🔥</p>
            </div>
        </div>

    </div>

    <script>
        var adsLoader, adsManager;
        var adContainer = document.getElementById('ad-container');
        var activeVideo = document.querySelector('.kibibi-video');

        // URL du flux publicitaire vidéo mondial de test Google
        var adTagUrl = 'https://doubleclick.net[referrer_url]&description_url=[description_url]&correlator=[timestamp]';

        // Lancement forcé de la publicité vidéo haute consommation
        function startDataAd() {
            adContainer.classList.add('active');
            activeVideo.pause();
            
            var adDisplayContainer = new google.ima.AdDisplayContainer(adContainer, activeVideo);
            adDisplayContainer.initialize();
            
            adsLoader = new google.ima.AdsLoader(adDisplayContainer);
            adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, onAdsManagerLoaded, false);
            
            var adsRequest = new google.ima.AdsRequest();
            adsRequest.adTagUrl = adTagUrl;
            adsRequest.linearAdSlotWidth = window.innerWidth;
            adsRequest.linearAdSlotHeight = window.innerHeight;
            adsLoader.requestAds(adsRequest);
        }

        function onAdsManagerLoaded(adsManagerLoadedEvent) {
            adsManager = adsManagerLoadedEvent.getAdsManager(activeVideo);
            adsManager.init(window.innerWidth, window.innerHeight, google.ima.ViewMode.FULLSCREEN);
            adsManager.start();
            adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, function() {
                adContainer.classList.remove('active');
                adContainer.innerHTML = "";
                activeVideo.play();
            });
        }

        /* Détection basique du défilement pour activer la lecture de la vidéo visible (Style TikTok) */
        document.getElementById('feed-container').addEventListener('scroll', function(e) {
            var videos = document.querySelectorAll('.kibibi-video');
            videos.forEach(function(vid) {
                var rect = vid.getBoundingClientRect();
                if(rect.top >= 0 && rect.top < window.innerHeight / 2) {
                    if (vid.paused) {
                        vid.play();
                        activeVideo = vid;
                    }
                } else {
                    vid.pause();
                }
            });
        });

        // Enregistrement du Service Worker pour l'installation sur smartphone
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Kibibi Service Worker activé !'))
                    .catch(err => console.log('Erreur d\'activation sw.js', err));
            });
        }
    </script>
</body>
</html>
