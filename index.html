<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kibibi - Short Videos</title>
    <!-- SDK Google IMA officiel pour la monétisation internationale (Lien corrigé) -->
    <script src="https://googleapis.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* Conteneur principal style TikTok (Vertical Snap) */
        .tiktok-container { width: 100%; height: 100vh; scroll-snap-type: y mandatory; overflow-y: scroll; scroll-behavior: smooth; }
        
        /* Chaque flux vidéo prend tout l'écran */
        .video-feed { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; }
        
        video { width: 100%; height: 100%; object-fit: cover; background-color: #000; }
        
        /* Nom de l'application et overlays */
        .brand-header { position: absolute; top: 20px; left: 0; width: 100%; text-align: center; z-index: 20; pointer-events: none; }
        .brand-header h1 { color: #fff; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: 800; letter-spacing: 1px; }
        .brand-header span { color: #00f2fe; }

        /* Interface utilisateur sur le côté (Bouton de monétisation) */
        .side-bar { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; z-index: 20; align-items: center; }
        .action-btn { width: 55px; height: 55px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 22px; cursor: pointer; border: none; backdrop-filter: blur(5px); }
        .action-btn.monetize { background: #ff007f; animation: pulse 2s infinite; }
        
        /* Infos de la vidéo en bas */
        .video-meta { position: absolute; left: 15px; bottom: 40px; z-index: 20; color: white; max-width: 75%; text-shadow: 0 1px 3px rgba(0,0,0,0.8); pointer-events: none; }
        .video-meta h3 { font-size: 16px; margin-bottom: 5px; }
        .video-meta p { font-size: 14px; opacity: 0.9; }

        /* Style des notifications à l'écran */
        .data-alert { position: absolute; top: 70px; background: rgba(0, 0, 0, 0.7); color: #00f2fe; padding: 8px 15px; border-radius: 20px; font-size: 12px; z-index: 25; font-weight: bold; display: none; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 0, 127, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 127, 0); }
        }
    </style>
</head>
<body>

    <!-- Entête Fixe -->
    <div class="brand-header">
        <h1>KIBI<span>BI</span></h1>
    </div>

    <!-- Notification de consommation de Mo -->
    <center><div class="data-alert" id="status-alert">Chargement du flux publicitaire...</div></center>

    <!-- Flux de vidéos de l'application -->
    <div class="tiktok-container" id="feed-container">
        
        <!-- Vidéo 1 (Lien vidéo réel et valide) -->
        <div class="video-feed">
            <video loop muted autoplay playsinline class="kibibi-video">
                <source src="https://googleapis.com" type="video/mp4">
            </video>
            <div class="side-bar">
                <button class="action-btn monetize" onclick="startDataAd()">💰</button>
                <div style="color:white; font-size:11px; font-weight:bold; text-shadow: 0 1px 2px #000;">Bonus</div>
            </div>
            <div class="video-meta">
                <h3>@impact_academy</h3>
                <p>Bienvenue sur Kibibi ! Swipez vers le bas pour charger le flux mondial 🌍</p>
            </div>
        </div>

        <!-- Vidéo 2 (Lien vidéo lourd réel et valide) -->
        <div class="video-feed">
            <video loop muted playsinline class="kibibi-video">
                <source src="https://googleapis.com" type="video/mp4">
            </video>
            <div class="side-bar">
                <button class="action-btn monetize" onclick="startDataAd()">💰</button>
            </div>
            <div class="video-meta">
                <h3>@africantech</h3>
                <p>Le contenu HD se charge en tâche de fond pour une fluidité maximale 🔥</p>
            </div>
        </div>

    </div>

    <script>
        var activeVideo = document.querySelector('.kibibi-video');
        var statusAlert = document.getElementById('status-alert');

        // Fonction robuste pour lancer une vidéo publicitaire lourde haute consommation
        function startDataAd() {
            // Vidéo HD de test (Simule une publicité vidéo de 15 Mo)
            var publiciteVideoUrl = "https://googleapis.com";
            
            // Affichage de l'alerte de consommation
            statusAlert.style.display = "block";
            statusAlert.innerText = "Téléchargement de la publicité... (Consommation : ~15 MB)";
            
            // Configuration de la vidéo publicitaire
            activeVideo.src = publiciteVideoUrl;
            activeVideo.muted = false; // Active le son pour l'utilisateur
            activeVideo.loop = false;  // Ne tourne pas en boucle
            activeVideo.load();
            
            var playPromise = activeVideo.play();
            
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // La vidéo se lance avec succès
                    setTimeout(() => { statusAlert.style.display = "none"; }, 3000);
                }).catch(error => {
                    // Secours automatique si le système du téléphone bloque le son sans interaction préalable
                    activeVideo.muted = true;
                    activeVideo.play();
                });
            }

            // Quand la vidéo pub se termine, on remet le flux normal TikTok
            activeVideo.onended = function() {
                statusAlert.style.display = "block";
                statusAlert.innerText = "Publicité terminée ! Retour au flux.";
                activeVideo.src = "https://googleapis.com";
                activeVideo.muted = true;
                activeVideo.loop = true;
                activeVideo.play();
                setTimeout(() => { statusAlert.style.display = "none"; }, 2000);
            };
        }

        /* Gestion du défilement tactile (Style TikTok) */
        document.getElementById('feed-container').addEventListener('scroll', function(e) {
            var videos = document.querySelectorAll('.kibibi-video');
            videos.forEach(function(vid) {
                var rect = vid.getBoundingClientRect();
                // Si la vidéo occupe la majeure partie de l'écran visible
                if(rect.top >= -window.innerHeight / 2 && rect.top < window.innerHeight / 2) {
                    if (vid.paused) {
                        vid.play();
                        activeVideo = vid;
                    }
                } else {
                    vid.pause();
                }
            });
        });

        // Enregistrement automatique du Service Worker pour installer l'application sur l'écran d'accueil
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Kibibi Service Worker activé !'))
                    .catch(err => console.log('Erreur d\'activation sw.js', err));
            });
        }
    </script>
</body>
</html>
